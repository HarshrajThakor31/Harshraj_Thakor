    <path d="M 10 16 L 15 21 L 23 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="44" y="23" fill="#ffffff" font-size="21" font-weight="800" letter-spacing="1" class="font-sans">CREVIO</text>
