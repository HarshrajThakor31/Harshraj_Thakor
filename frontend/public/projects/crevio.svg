      <rect x="662" y="110" width="95" height="26" rx="13" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
      <text x="709.5" y="127" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Dual Signed</text>

      <!-- Row 3 -->
