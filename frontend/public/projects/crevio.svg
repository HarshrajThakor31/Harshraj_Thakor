      <text x="24" y="202" fill="#a78bfa" font-size="11" font-weight="600" class="font-sans">IMMUTABLE CRYPTOGRAPHIC HASH</text>
      <text x="24" y="224" fill="#38bdf8" font-size="13" font-weight="500" class="font-mono">SHA-256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>
      <rect x="668" y="196" width="89" height="26" rx="13" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.4" />
      <text x="712.5" y="213" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Neon Synced</text>

      <!-- Row 4 -->
